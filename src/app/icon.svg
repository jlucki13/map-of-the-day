<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Map of the Day">
  <!-- Tab icon: the game's globe, drawn to survive being 16px wide. The land
       masses are deliberately few and fat — at tab size, anything with a
       coastline turns to mush — and there is a single faint meridian rather
       than a graticule, because a second line crossing it reads as a crosshair
       instead of a sphere. Palette is the app's own ocean/land/sand ramps. -->
  <rect width="32" height="32" rx="7" fill="#f7f1e3" />
  <circle cx="16" cy="16" r="11.5" fill="#24688e" />

  <!-- Suggestive, not accurate: enough mass to read as "a world" at 16px. -->
  <path
    fill="#2f9066"
    d="M6.2 12.6c1.6-2.4 4.6-3.6 7-2.5 1.6.8 1.7 2.9.4 4-1.3 1.1-3 1-4.3 1.9-1 .7-1.2 2.2-2.4 2.4-1.3.2-2.2-1.2-2.2-2.5 0-1.2.7-2.4 1.5-3.3Z"
  />
  <path
    fill="#2f9066"
    d="M13.6 18.6c1.7-.8 3.7.4 4 2.3.3 1.8-.5 3.5-.4 5.3 0 .5-.4 1-.9 1-1.9-.2-3-2-3.4-3.8-.4-1.6-.8-3.9.7-4.8Z"
  />
  <path
    fill="#2f9066"
    d="M20.4 7.5c2.3-.6 5 .4 6.2 2.4.6 1-.2 2.3-1.3 2.5-1.9.4-3.4 1.7-5.3 1.9-1.5.2-2.7-1.2-2.6-2.7.1-1.9 1.2-3.7 3-4.1Z"
  />

  <!-- One meridian, faint: enough curvature to say "globe", not enough to
       compete with the land. -->
  <path
    d="M16 4.5c-3.6 3.4-3.6 19.6 0 23"
    fill="none"
    stroke="#f7f1e3"
    stroke-opacity=".3"
    stroke-width="1.2"
  />

  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#123852" stroke-width="1.6" />
</svg>
